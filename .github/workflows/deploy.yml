name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires for CI runs on every branch, so the branch check is
    # load-bearing: without it any branch with green CI would deploy production.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main' }}
    steps:
      # For workflow_run events checkout defaults to the default-branch tip, not
      # the commit CI tested. Pin it to the tested SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Deploy
        run: |
          npx aws-cdk@2 deploy --require-approval never \
            -c playlist_id=${{ vars.PLAYLIST_ID }} \
            -c vault_repo_owner=${{ vars.VAULT_REPO_OWNER }} \
            -c vault_repo_name=${{ vars.VAULT_REPO_NAME }} \
            -c bedrock_region=${{ vars.BEDROCK_REGION }}
